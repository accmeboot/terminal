set -g default-terminal "tmux-256color"
set -g default-shell "$SHELL"
set -g status-keys vi
setw -g aggressive-resize on
setw -g clock-mode-style 12
set -g history-limit 2000

# settings for image preview to work in yazi
set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -sg escape-time 0

set -g prefix C-n
unbind C-b
bind-key C-n send-prefix

set-option -sa terminal-overrides "ghostty"

set -g extended-keys always

set-option -g focus-events on

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

bind-key f split-window -v -c "#{pane_current_path}" 'yazi'

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on


set -g pane-border-style fg=colour7
set -g pane-active-border-style fg=colour7

set -g status-position top
set -g window-status-separator ""
set -g status-left-length 50

set -Fg "status-format[0]" "#{status-format[0]}"
set -g "status-format[1]" ""
set -g status 2

set -g message-style "fg=colour7,bg=terminal"
set -g message-command-style "fg=colour7,bg=terminal"

set -g status-style "fg=colour7,bg=default"

set -g status-left ""

set -g window-status-format "#[fg=colour7,bg=terminal] #I:#W "
set -g window-status-current-format "#[fg=colour0,bg=colour4] #I:#W "

set -g status-right-length 100
set -g status-right "#[fg=colour7,bg=terminal] #S"

# --- from tmux-yank ---
# Copies reach the system clipboard through the terminal (OSC 52), so no
# wl-copy/pbcopy is needed on either OS.
set -s set-clipboard on
# copy and paste at the prompt
bind-key -T copy-mode-vi 'Y' send -X copy-selection-and-cancel \; paste-buffer -p
# prefix + Y: copy the pane's working directory
bind-key Y run-shell -b "tmux set-buffer -w '#{pane_current_path}' && tmux display-message 'PWD copied to clipboard!'"

# --- from vim-tmux-navigator ---
# C-h/j/k/l and C-\ move between panes, or are passed through when the pane
# runs (n)vim or fzf so the vim plugin can handle them.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
# prefix + C-l: clear the screen, since C-l alone now moves panes
bind-key C-l send-keys 'C-l'
